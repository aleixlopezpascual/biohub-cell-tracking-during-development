data:
  path: data/train
  patch_size: [16, 128, 128]
  stride: [8, 96, 96]
  scale: [1.625, 0.40625, 0.40625]
model:
  name: unet3d
  in_channels: 1
  out_channels: 1
tracking:
  max_distance_um: 7.0
  allow_divisions: true
metrics:
  node_match_distance_um: 7.0
  adjusted_penalty: 0.1
  division_weight: 0.1
submission:
  path: submission.csv
