# Recommended high-ceiling workflow. Requires the separate Royerlab Kaggle
# support pack (TemporalUNet3D/SimpleNodeTransformer weights, tracksdata, GEFF).
data:
  zarr_path: data/test/testA.zarr
  resolution_level: 0
  voxel_size_um: [1.625, 0.40625, 0.40625]
  channels: [0]
  patch_size: [64, 64, 64]
  frame_pair_stride: 1

royerlab:
  enabled: true
  heatmap_threshold: 0.97
  peak_min_distance_um: 3.0
  use_xy_d4_tta: true
  edge_strong_threshold: 0.5
  edge_min_threshold: 0.2
  edge_top_k_parents: 3
  edge_max_distance_um: 12.0
  gap_closing_max_distance_um: 12.0
  min_component_nodes: 3
  max_nodes: null
