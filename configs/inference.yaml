# Inference-focused overrides of configs/default.yaml.
data:
  zarr_path: data/test/testA.zarr
  resolution_level: 0
  voxel_size_um: [1.625, 0.40625, 0.40625]
  channels: [0]
  patch_size: [32, 128, 128]
  frame_pair_stride: 1

model:
  architecture: unet3d
  in_channels: 1
  out_channels: 1
  base_features: 32
  depth: 4
  norm: instance

tracking:
  max_link_distance_um: 15.0
  division_search_radius_um: 20.0
  max_daughters: 2
  gating_time_window: 1

metrics:
  node_match_max_distance_um: 7.0
  adjusted_jaccard_alpha: 0.1
  division_weight: 0.1
  division_window: 1
